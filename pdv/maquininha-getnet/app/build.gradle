plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.payax.pdv.getnet'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.payax.pdv.getnet"
        // As maquininhas POS Digital rodam Android 7 ou mais novo.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
