#
# Manager Provedor — nginx.
#
# O certbot acrescenta sozinho o bloco de TLS e o desvio de HTTP para HTTPS quando o certificado sai.
#
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    # O nome do servidor não vai no cabeçalho: ninguém de fora precisa saber a versão do nginx.
    server_tokens off;

    # Anexo, comprovante, foto de chamado e arquivo de retorno do banco passam por aqui.
    client_max_body_size 32m;

    # Cabeçalhos de segurança. A política de conteúdo fica no próprio sistema, que sabe o que carrega.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:__PORTA__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # O ACS espera o roteador do assinante ligar de volta, e a varredura de concentrador demora.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }

    # Verificação de saúde: responde sem autenticação, e não precisa ir para o registro de acesso.
    location = /api/saude {
        proxy_pass http://127.0.0.1:__PORTA__;
        access_log off;
    }
}
