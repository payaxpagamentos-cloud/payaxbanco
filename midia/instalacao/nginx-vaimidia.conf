# Vai Mídia — nginx na frente do sistema.
#
# O Node fica em 127.0.0.1:3600 e nunca é exposto direto: quem atende a internet é o nginx, que
# também é quem vai receber o certificado do HTTPS (o certbot escreve nele sozinho).
#
# Depois de trocar __DOMINIO__, este arquivo vai para /etc/nginx/sites-available/vaimidia.

server {
    listen 80;
    # A linha do IPv6 só entra quando a máquina tem IPv6 — em servidor sem ele, o nginx nem sobe.
    #IPV6#listen [::]:80;
    server_name __DOMINIO__ www.__DOMINIO__;

    # O certbot acrescenta aqui o redirecionamento para HTTPS quando emite o certificado.
    access_log /var/log/nginx/vaimidia.access.log;
    error_log  /var/log/nginx/vaimidia.error.log;

    # Criativo de campanha é vídeo: o padrão do nginx (1 MB) barraria o envio.
    client_max_body_size 220M;

    # Vídeo demora para subir e para sair; sem isto, o nginx corta no meio.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;

    # Atalho: quem digita só /tv cai no player (menos tecla no controle remoto).
    location = /tv { return 301 /midia/tv/; }

    location / {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
    }
}

# O painel também tem endereço próprio: midia.SEU-DOMINIO leva direto para ele.
# Existe por conveniência de quem usa o sistema todo dia — o site continua no domínio principal.
server {
    listen 80;
    #IPV6#listen [::]:80;
    server_name midia.__DOMINIO__;

    access_log /var/log/nginx/vaimidia.access.log;
    error_log  /var/log/nginx/vaimidia.error.log;

    client_max_body_size 220M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;

    # A raiz deste endereço é a entrada do painel, não o site.
    location = / { return 302 /midia/; }

    location / {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
    }
}

# A TV tem o endereço mais curto possível: digitar com controle remoto é um suplício.
# tv.SEU-DOMINIO abre direto o player.
server {
    listen 80;
    #IPV6#listen [::]:80;
    server_name tv.__DOMINIO__;

    access_log /var/log/nginx/vaimidia.access.log;
    error_log  /var/log/nginx/vaimidia.error.log;

    client_max_body_size 220M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # A raiz deste endereço é o player.
    location = / { return 302 /midia/tv/; }

    location / {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
    }
}
